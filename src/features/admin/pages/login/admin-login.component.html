<main class="login-page">
  <section class="login-shell" aria-label="Administrator sign-in">
    <div class="login-intro">
      <img
        class="login-intro-logo"
        src="/assets/brand/admin-login-illustration.png"
        alt="Moroccanoil"
        width="1000"
        height="482"
      />
      <h1>Welcome back.</h1>
      <p>Sign in to manage your store and track business performance.</p>
    </div>

    <form class="login-card" (ngSubmit)="signIn()" #loginForm="ngForm">
      <img
        class="brand-logo"
        src="/assets/brand/moroccanoil-wordmark.png"
        alt="Moroccanoil"
        width="540"
        height="47"
      />
      <div class="login-heading">
        <h2>Admin sign-in</h2>
        <p>Enter your account details to continue.</p>
      </div>

      <label for="admin-email">
        Email
        <input
          id="admin-email"
          type="email"
          name="email"
          autocomplete="username"
          placeholder="admin@haircare.vn"
          required
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </label>

      <label for="admin-password">
        Password
        <input
          id="admin-password"
          type="password"
          name="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
      </label>

      @if (errorMessage()) {
        <p class="login-error" role="alert">{{ errorMessage() }}</p>
      }

      <button class="submit" type="submit" [disabled]="loginForm.invalid || submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
      <small class="login-demo">Demo account: admin@haircare.vn<br />Password: admin123</small>
    </form>
  </section>
</main>
