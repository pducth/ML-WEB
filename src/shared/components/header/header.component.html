<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-[#E7E3DC] transition-all">
  <div
    class="bg-[#4A2E2B] text-[#FDFBF7] text-xs py-2 px-4 text-center font-medium tracking-wide flex items-center justify-center gap-2"
  >
    <span>✨ ƯU ĐÃI ĐỘC QUYỀN: Miễn phí vận chuyển toàn quốc cho đơn hàng từ 800.000₫ • Nhập mã <strong
        class="text-[#00A3A6] font-bold">MOROCCO10</strong> giảm ngay 10%</span>
  </div>

  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-2 sm:gap-4">
    <div
      class="flex items-center gap-3 cursor-pointer select-none group"
      role="link"
      tabindex="0"
      (click)="navigateTo.emit('/')"
      (keydown.enter)="navigateTo.emit('/')"
    >
      <div
        class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-[#6E473B] text-white flex items-center justify-center font-black text-xl sm:text-2xl tracking-tighter shadow-md group-hover:bg-[#4A2E2B] group-hover:scale-105 transition-all"
      >
        M
      </div>
      <div>
        <span
          class="block text-base sm:text-xl font-bold tracking-wider text-[#4A2E2B] group-hover:text-[#6E473B] transition-colors uppercase"
          >MOROCCANOIL</span
        >
        <span class="hidden sm:block text-[11px] font-semibold text-[#8A5B4D] tracking-widest uppercase"
          >ARGAN HAIRCARE LUXURY</span
        >
      </div>
    </div>

    <nav class="hidden lg:flex items-center space-x-1 lg:space-x-4" aria-label="Điều hướng chính">
      <button
        type="button"
        (click)="navigateTo.emit('/')"
        class="px-3 py-2 text-sm font-semibold text-[#6E473B] border-b-2 border-[#6E473B] transition-all hover:text-[#6E473B]"
      >
        Trang chủ
      </button>
      <button
        type="button"
        (click)="navigateTo.emit('/shop')"
        class="px-3 py-2 text-sm font-medium text-[#4A2E2B]/80 transition-all hover:text-[#6E473B]"
      >
        Cửa hàng
      </button>
      <button
        type="button"
        (click)="startQuiz.emit()"
        class="px-3 py-2 text-sm font-medium text-[#4A2E2B]/80 transition-all hover:text-[#6E473B] flex items-center gap-1.5"
      >
        <span>Quiz tư vấn tóc</span>
        <span class="bg-[#00A3A6] text-white rounded-full text-[10px] py-0 px-1.5">Mới</span>
      </button>
      <button
        type="button"
        (click)="accountClick.emit()"
        class="px-3 py-2 text-sm font-medium text-[#4A2E2B]/80 transition-all hover:text-[#6E473B]"
      >
        Tài khoản VIP
      </button>
      <button
        type="button"
        (click)="navigateTo.emit('/orders')"
        class="px-3 py-2 text-sm font-medium text-[#4A2E2B]/80 transition-all hover:text-[#6E473B]"
      >
        Đơn hàng
      </button>
      @if (isAdmin()) {
        <button
          type="button"
          (click)="navigateTo.emit('/admin/dashboard')"
          class="px-3 py-2 text-sm font-bold text-red-700 bg-red-50 rounded-lg hover:bg-red-100 transition-all"
        >
          Admin Portal
        </button>
      }
    </nav>

    <div class="flex items-center space-x-1 sm:space-x-3">
      <button
        type="button"
        (click)="navigateTo.emit('/shop')"
        class="p-2.5 rounded-full text-[#4A2E2B] hover:bg-[#F7F3EC] transition-all"
        title="Tìm kiếm"
        aria-label="Tìm kiếm sản phẩm"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          ></path>
        </svg>
      </button>
      <button
        type="button"
        (click)="accountClick.emit()"
        class="flex items-center gap-2 px-2 sm:px-3.5 py-2 rounded-full border border-[#E7E3DC] hover:border-[#6E473B] text-[#4A2E2B] text-xs font-semibold hover:bg-[#F7F3EC] transition-all"
      >
        <svg class="w-4 h-4 text-[#6E473B]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          ></path>
        </svg>
        <span class="hidden sm:inline">{{ accountLabel() }}</span>
      </button>
      <button
        type="button"
        (click)="cartClick.emit()"
        class="relative p-2.5 rounded-full bg-[#6E473B] text-white hover:bg-[#4A2E2B] hover:scale-105 active:scale-95 transition-all shadow-md"
        title="Giỏ hàng"
        aria-label="Mở giỏ hàng"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
          ></path>
        </svg>
        @if (cartItemCount() > 0) {
          <span
            class="absolute -top-1.5 -right-1.5 bg-[#00A3A6] text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow"
            aria-live="polite"
            >{{ cartItemCount() }}</span
          >
        }
      </button>
    </div>
  </div>
</header>
