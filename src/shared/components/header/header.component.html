<header class="sticky top-0 z-40 border-b border-[#E7E3DC] bg-white/95 backdrop-blur-md">
  <div class="bg-[#4A2E2B] px-4 py-2 text-center text-xs font-medium tracking-wide text-[#FDFBF7]">
    ✨ EXCLUSIVE OFFER: Free shipping on orders over $35 · Use code
    <strong class="text-[#00A3A6]">MOROCCO10</strong> for 10% off
  </div>

  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
    <button
      type="button"
      class="group shrink-0 py-1"
      (click)="navigateTo.emit('/')"
      aria-label="Moroccanoil home"
    >
      <img
        src="/assets/brand/moroccanoil-emblem-header.png"
        alt="Moroccanoil"
        class="h-12 w-auto object-contain transition-transform duration-200 group-hover:scale-105 sm:h-14 md:h-16"
      />
    </button>

    <nav class="hidden items-center space-x-1 md:flex lg:space-x-3" aria-label="Main navigation">
      <button type="button" (click)="navigateTo.emit('/')" class="header-nav-link" [class.active]="isActive('home')">Home</button>
      <div class="shop-dropdown-wrapper">
        <button type="button" (click)="navigateTo.emit('/shop')" class="header-nav-link flex items-center gap-1" [class.active]="isActive('shop')">
          Shop
          <svg class="h-3.5 w-3.5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"></path>
          </svg>
        </button>
        <div class="shop-mega-menu">
          <button type="button" (click)="filterCategory('Styling & Finishing')">Styling &amp; Finishing</button>
          <button type="button" (click)="filterCategory('Hair Masks')">Hair Masks</button>
          <button type="button" (click)="filterCategory('Shampoo')">Shampoo</button>
          <button type="button" (click)="filterCategory('Conditioner')">Conditioner</button>
          <button type="button" (click)="filterCategory('Treatment/Oil')">Treatment / Oil</button>
          <button type="button" (click)="filterCategory('Dry Shampoo')">Dry Shampoo</button>
        </div>
      </div>
      <button type="button" (click)="startQuiz.emit()" class="header-nav-link flex items-center gap-1.5" [class.active]="isActive('quiz')">
        Hair Quiz <span class="rounded-full bg-[#00A3A6] px-1.5 text-[10px] text-white">New</span>
      </button>
      @if (isAdmin()) {
        <button
          type="button"
          (click)="navigateTo.emit('/admin/dashboard')"
          class="rounded-lg bg-red-50 px-3 py-2 text-sm font-bold text-red-700 transition-colors hover:bg-red-100"
        >
          Admin Portal
        </button>
      }
    </nav>

    <form class="header-search hidden lg:flex" (submit)="$event.preventDefault(); submitSearch()">
      <svg class="h-4 w-4 shrink-0 text-[#9B938B]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"></path>
      </svg>
      <input
        type="search"
        aria-label="Search products"
        placeholder="Search argan oil, shampoo, mask..."
        [value]="searchQuery()"
        (input)="updateSearch($event)"
      />
    </form>

    <div class="hidden shrink-0 items-center gap-2 rounded-full border border-[#E7E3DC] bg-[#F7F3EC] px-3 py-1.5 text-[11px] text-[#6B625B] xl:flex">
      <span class="h-2 w-2 animate-pulse rounded-full bg-[#00A3A6]"></span>
      <span>Salon Advisor: <a href="tel:19006868" class="font-bold text-[#4A2E2B]">1900 6868</a></span>
    </div>

    <div class="flex shrink-0 items-center space-x-1 sm:space-x-3">
      <button
        type="button"
        (click)="navigateTo.emit('/shop')"
        class="rounded-full p-2.5 text-[#4A2E2B] transition-colors hover:bg-[#F7F3EC] lg:hidden"
        title="Search"
        aria-label="Search products"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"></path>
        </svg>
      </button>
      <button
        type="button"
        (click)="accountClick.emit()"
        class="flex items-center gap-2 rounded-full border border-[#E7E3DC] px-2 py-2 text-xs font-semibold text-[#4A2E2B] transition-colors hover:border-[#6E473B] hover:bg-[#F7F3EC] sm:px-3.5"
      >
        <svg class="h-4 w-4 text-[#6E473B]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM12 14a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7Z"></path>
        </svg>
        <span class="hidden sm:inline">{{ accountLabel() }}</span>
      </button>
      <button
        type="button"
        (click)="cartClick.emit()"
        class="relative rounded-full bg-[#6E473B] p-2.5 text-white shadow-md transition-all hover:scale-105 hover:bg-[#4A2E2B] active:scale-95"
        title="Shopping bag"
        aria-label="Open shopping bag"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 0 0-8 0v4M5 9h14l1 12H4L5 9Z"></path>
        </svg>
        @if (cartItemCount() > 0) {
          <span class="absolute -right-1.5 -top-1.5 flex h-5 min-w-5 items-center justify-center rounded-full border-2 border-white bg-[#00A3A6] px-1 text-[11px] font-bold text-white" aria-live="polite">
            {{ cartItemCount() }}
          </span>
        }
      </button>
    </div>
  </div>
</header>
