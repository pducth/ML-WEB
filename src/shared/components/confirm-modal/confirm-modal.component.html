@if (open()) {
  <div class="modal-layer" (keydown.escape)="cancelled.emit()">
    <button class="modal-backdrop" type="button" aria-label="Close dialog" (click)="cancelled.emit()"></button>
    <section
      class="modal-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
      aria-describedby="confirm-modal-message"
    >
      <h2 id="confirm-modal-title">{{ title() }}</h2>
      <p id="confirm-modal-message">{{ message() }}</p>
      <div class="modal-actions">
        <app-button variant="outline" (click)="cancelled.emit()">{{ cancelLabel() }}</app-button>
        <app-button [variant]="confirmVariant()" (click)="confirmed.emit()">{{ confirmLabel() }}</app-button>
      </div>
    </section>
  </div>
}
