<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HairCare Insight · Admin</title>
<style>
:root{--teal:#4BA3AB;--teal-d:#286D74;--teal-l:#E7F3F3;--or:#5D3C33;--or-l:#F2EAE6;--ink:#302822;--mut:#786E68;--bg:#F7F5F2;--card:#fff;--line:#E7E1DB;--ok:#2E9E6B;--err:#D64545;--okl:#E4F5EC;--errl:#FBE9E9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--teal-d:#8BCBD0;--teal-l:#213B3D;--or:#D7B6A8;--or-l:#3E302B;--ink:#F1EBE6;--mut:#BFB3AB;--bg:#1C1917;--card:#272321;--line:#433A35;--okl:#20382D;--errl:#452B2B;color-scheme:dark}}
:root[data-theme=dark]{--teal-d:#8BCBD0;--teal-l:#213B3D;--or:#D7B6A8;--or-l:#3E302B;--ink:#F1EBE6;--mut:#BFB3AB;--bg:#1C1917;--card:#272321;--line:#433A35;--okl:#20382D;--errl:#452B2B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside img{width:100%;max-width:190px;margin:2px 6px 4px;display:block}.sub{font-size:11px;letter-spacing:.14em;color:var(--or);font-weight:700;margin:0 6px 18px;text-transform:uppercase}
nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:600;margin-bottom:2px}
nav a:hover{background:var(--teal-l);color:var(--teal-d)}nav a.on{background:var(--teal);color:#fff}
nav small{margin:14px 12px 4px;display:block;font-size:11px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
nav .n{margin-left:auto;background:var(--or);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
main{padding:0 28px 40px;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap}
header h1{font-size:22px;margin:0;flex:1}header h1 span{display:block;font-size:12px;color:var(--mut);font-weight:500}
.av{width:36px;height:36px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
input:focus,select:focus{outline:2px solid var(--teal);border-color:transparent}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;font:inherit;font-weight:700}
.btn:hover{background:var(--teal-d)}.btn.or{background:var(--or)}.btn.gh{background:var(--card);color:var(--teal-d);border:1px solid var(--teal)}.btn.sm{padding:4px 10px;font-size:12px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}.card h3 em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mut);font-weight:500}
.kpi .l{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}.kpi .v{font-size:28px;font-weight:800;margin:4px 0}.kpi{border-top:4px solid var(--teal)}.kpi.o{border-top-color:var(--or)}
.up{color:var(--ok);font-size:12px;font-weight:700}.dn{color:var(--err);font-size:12px;font-weight:700}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--teal-l);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}tr:hover td{background:var(--teal-l)}
.b{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--teal-l);color:var(--teal-d)}
.b.w{background:var(--or-l);color:var(--or)}.b.g{background:var(--okl);color:var(--ok)}.b.r{background:var(--errl);color:var(--err)}.b.x{background:var(--line);color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.bar.o i{background:var(--or)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:600;color:var(--mut)}.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.alert{display:flex;gap:10px;align-items:center;background:var(--or-l);border-left:4px solid var(--or);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.tool input{flex:1;min-width:180px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.form label{display:grid;gap:5px;font-weight:600;font-size:13px}
.sw{width:42px;height:24px;border-radius:99px;background:var(--teal);position:relative;display:inline-block}.sw:after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}.sw.off{background:var(--line)}.sw.off:after{right:auto;left:3px}
.stars{color:var(--or);letter-spacing:2px}
.ov{position:fixed;inset:0;background:#302822b3;display:grid;place-items:center;z-index:50;padding:16px}.md{background:var(--card);border-radius:16px;padding:22px;width:min(440px,100%);display:grid;gap:14px}.md h3{margin:0}.md .act{display:flex;gap:8px;justify-content:flex-end}.md label{display:grid;gap:5px;font-weight:600;font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-weight:600}
.app.login{grid-template-columns:1fr}.app.login aside,.app.login header{display:none}.app.login main{display:grid;place-items:center;min-height:100vh;background:linear-gradient(135deg,var(--teal-l),var(--or-l))}.lg{width:min(400px,100%);display:grid;gap:14px}.lg img{width:230px;margin:0 auto}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{flex:1;min-width:90px;text-align:center;padding:8px 4px;border-radius:10px;background:var(--line);color:var(--mut);font-size:12px;font-weight:700}.steps .d{background:var(--teal);color:#fff}.steps .c{background:var(--or);color:#fff}
.ph{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center;padding:4px}.ph.f{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}.g6{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.back{color:var(--teal-d);text-decoration:none;font-weight:700;display:inline-block;margin-bottom:12px}textarea{width:100%;resize:vertical}td input{width:100px;padding:5px 8px}
#menu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-direction:column}nav{display:none}nav.open{display:block}#menu{display:inline-block}main{padding:0 16px 32px}}

/* Brand palette and navigation matching the supplied reference. */
:root{--brown:#5D3C33;--sidebar-text:#F4EDE7;--on-teal:#132F32;accent-color:var(--teal)}
[hidden]{display:none!important}
.brand-logo{display:block;object-fit:contain;height:auto;max-width:100%;aspect-ratio:3791/385;flex-shrink:0}
.app{grid-template-columns:260px minmax(0,1fr)}
aside{background:var(--brown);color:var(--sidebar-text);border-right:0;padding:32px 18px 20px;display:flex;flex-direction:column;gap:0;min-height:0;overflow:hidden;height:100dvh}
aside .brand-logo{width:216px;max-width:100%;margin:0 4px 12px}
.sub{color:#D6C4BB;letter-spacing:.09em;font-size:10px;margin:0 4px 28px}
nav{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#A17D6D transparent;padding-right:2px}
nav a{padding:11px 16px;min-height:44px;gap:15px;margin:0 0 4px;border-radius:12px;color:var(--sidebar-text);font-size:15px;font-weight:500;transition:background .16s,color .16s}
nav a svg,.logout svg,.theme-toggle svg{width:23px;height:23px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:#745248;color:#fff}nav a.on{background:#4BA3AB;color:var(--on-teal);font-weight:650}
.sidebar-footer{flex:none;margin-top:18px;padding:18px 8px 0;border-top:1px solid #8D6B5E}
.admin-profile{display:flex;align-items:center;gap:11px;padding:0 8px 13px}.admin-profile b{font-size:15px;font-weight:650}.admin-profile small{display:block;color:#D6C4BB;font-size:12px;margin-top:2px}.profile-dot{width:9px;height:9px;background:#78C1C7;border-radius:50%;box-shadow:0 0 0 5px #ffffff0d}
.logout{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;min-height:44px;font:inherit;font-weight:500;background:transparent;border:1px solid #927064;border-radius:10px;color:var(--sidebar-text);cursor:pointer}.logout:hover{background:#745248}
header{padding:25px 0 23px;flex-wrap:nowrap}header h1{font-size:26px;letter-spacing:-.6px;line-height:1.3}.theme-toggle{padding:10px;display:grid;place-items:center;min-width:44px;min-height:44px;border-color:var(--line)!important;color:var(--ink)!important}
.btn:not(.gh):not(.or),.chip.on,.steps .d{color:var(--on-teal)}.btn.or,.steps .c{background:var(--brown);color:#fff}
a.btn{text-decoration:none;white-space:nowrap}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{box-shadow:0 3px 12px #30282203}.card h3{flex-wrap:wrap}.card h3 em{overflow-wrap:anywhere}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.section-heading h3{margin:0;font-size:16px}.range-label{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--mut)}.range-label>span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.range-label select{font-size:12px;padding:7px 10px;min-height:36px;max-width:100%;cursor:pointer}
.chart-caption{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:12px}.chart-legend{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;color:var(--mut);margin-top:12px}.chart-legend span{display:flex;align-items:center;gap:7px}.chart-legend i{width:18px;border-top:3px solid var(--teal)}.chart-legend .projected{border-top:3px dashed var(--or)}.chart-note{font-size:12px;color:var(--mut);margin:12px 0 0}.forecast-overview{margin-bottom:20px}.forecast-overview .forecast-card>svg{max-height:260px;display:block}
input,select,textarea{min-height:40px}.form label{min-width:0}.form input,.form select{width:100%}.alert{flex-wrap:wrap}.row{flex-wrap:wrap}.g4{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
.app.login{display:block}.app.login main{padding:48px 28px;min-height:100dvh;background:var(--bg);display:grid;place-items:center}.app.login #view{width:100%;min-width:0}.login-shell{width:min(100%,1040px);margin:auto;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:72px;align-items:center}.login-intro-logo{display:block;width:400px;max-width:100%;height:auto;object-fit:contain;margin:0 0 18px}.login-intro h1{font-size:42px;line-height:1.2;letter-spacing:-1.3px;max-width:400px;margin:18px 0}.login-intro p{font-size:16px;line-height:1.8;color:var(--mut);max-width:370px}.lg{width:100%;max-width:none;min-width:0;padding:42px;display:grid;grid-template-columns:minmax(0,1fr);gap:23px;border-radius:22px;box-shadow:0 16px 55px #30282209}.lg .brand-logo{width:280px;max-width:100%;margin:0 0 10px}.login-heading h2{font-size:23px;line-height:1.4;margin:0 0 8px}.login-heading p{margin:0;color:var(--mut);font-size:13px}.lg label{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;font-size:14px;font-weight:600;min-width:0}.lg input{width:100%;min-width:0;min-height:50px;padding:12px 14px}.lg .btn{min-height:50px}.lg .alert{margin:0;font-size:13px}.login-demo{font-size:12px;color:var(--mut);line-height:1.8;text-align:center;padding-top:5px;overflow-wrap:anywhere}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
@media(max-width:1150px){.app{grid-template-columns:238px minmax(0,1fr)}main{padding-left:22px;padding-right:22px}aside{padding-left:14px;padding-right:14px}nav a{padding:12px;gap:12px;font-size:14px}.login-shell{gap:36px}.lg{padding:32px}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:20px;overflow:visible}aside .brand-logo{width:200px;margin-bottom:8px}.sub{margin-bottom:14px}#menu{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;color:var(--sidebar-text);border-color:#927064;background:transparent}nav{display:none;flex:none;margin-top:14px}nav.open{display:block}.sidebar-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px 0 0}.admin-profile{padding:0 6px}.logout{width:auto;min-width:120px}main{padding:0 20px 32px}.login-intro-logo{width:300px}.login-shell{max-width:560px;grid-template-columns:minmax(0,1fr);gap:22px}.login-intro h1{font-size:32px;max-width:none;margin:12px 0}.login-intro p{max-width:none;font-size:14px}.app.login main{padding:32px 20px}.lg{padding:32px}.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:480px){header h1{font-size:23px}main{padding-left:16px;padding-right:16px}.card{padding:16px}.lg{padding:25px 22px;gap:21px}.login-heading h2{font-size:21px}.login-intro h1{font-size:29px}.form{grid-template-columns:minmax(0,1fr)}.section-heading{gap:10px}.kpi .v{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

function revenueCard(){return `<div class="card revenue-card"><div class="section-heading"><h3>Revenue</h3>${RANGE('revenue')}</div>${bars(revenueData[periods.revenue])}<div class="chart-caption"><span>${periodLabels[periods.revenue]}</span><span>Currency: USD</span></div></div>`}
function forecastCard(){const [actual,predicted]=forecastData[periods.forecast];return `<div class="card forecast-card"><div class="section-heading"><h3>Revenue forecast</h3>${RANGE('forecast')}</div>${lines(actual,predicted)}<div class="chart-legend"><span><i></i>Actual revenue</span><span><i class="projected"></i>Forecast revenue</span></div><p class="chart-note">Next 14 days · Sample data · USD</p></div>`}

const B=(t,c="")=>`<span class="b ${c}">${t}</span>`;
const TB=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;

const bar=(p,o)=>`<div class="bar ${o?"o":""}"><i style="width:${p}%"></i></div>`;
const kpi=(l,v,d,o,up=1)=>`<div class="card kpi ${o?"o":""}"><div class="l">${l}</div><div class="v">${v}</div><div class="${up?"up":"dn"}">${d} vs. previous period</div></div>`;
const tool=(ph,btn)=>`<div class="tool"><input placeholder="${ph}"><select><option>All</option></select>${btn?`<button class="btn">${btn}</button>`:""}</div>`;
function bars(d){const m=Math.max(...d),w=100/d.length;return `<svg viewBox="0 0 400 150" width="100%" role="img" aria-label="Revenue chart">${d.map((v,i)=>`<rect x="${i*w*4+4}" y="${140-v/m*125}" width="${w*4-8}" height="${v/m*125}" rx="4" fill="${i==d.length-1?"var(--or)":"var(--teal)"}"/>`).join("")}<line x1="0" y1="140" x2="400" y2="140" stroke="var(--line)"/></svg>`}
function lines(a,f){const p=(d,o)=>d.map((v,i)=>`${(i+o)*(400/13)},${140-v*1.1}`).join(" ");return `<svg viewBox="0 0 400 150" width="100%" role="img" aria-label="Forecast"><polyline fill="none" stroke="#4BA3AB" stroke-width="3" points="${p(a,0)}"/><polyline fill="none" stroke="var(--or)" stroke-width="3" stroke-dasharray="6 5" points="${p(f,6)}"/><line x1="${6*400/13}" y1="5" x2="${6*400/13}" y2="140" stroke="var(--line)"/></svg>`}

if(GO[t])location.hash=GO[t];

function toggleTheme(){const r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches;const cur=r.dataset.theme||(d?"dark":"light");r.dataset.theme=cur=="dark"?"light":"dark";try{localStorage.setItem("haircare-theme",r.dataset.theme)}catch{}}
try{const theme=localStorage.getItem("haircare-theme");if(theme==="dark"||theme==="light")document.documentElement.dataset.theme=theme}catch{}
